[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Serve the intro video inline only (never as an attachment) and cache it at the edge
[[headers]]
  for = "/video/*"
  [headers.values]
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=604800"
